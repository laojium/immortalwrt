name: Build ImmortalWrt for YF 024E-30

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - '.github/workflows/build.yml'

env:
  IMMORTALWRT_REPO: https://github.com/laojium/immortalwrt
  BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
      - name: Checkout patches repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex gperf \
            libncurses5-dev libssl-dev python3 python3-dev \
            python3-pip ruby wget curl unzip rsync \
            quilt git subversion ninja-build

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 --single-branch ${IMMORTALWRT_REPO} openwrt

      - name: Verify RTL8211F PHY patch exists
        run: |
          if [ -f "openwrt/target/linux/rockchip/patches-6.12/014-fix-gmac1-rtl8211f.patch" ]; then
            echo "✓ Patch 014-fix-gmac1-rtl8211f.patch found in source"
            echo "Patch content preview:"
            head -20 openwrt/target/linux/rockchip/patches-6.12/014-fix-gmac1-rtl8211f.patch
          else
            echo "✗ Patch 014-fix-gmac1-rtl8211f.patch not found in source"
            exit 1
          fi

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware (slim build)
        run: |
          cd openwrt
          cat > .config <<'CONFIGEOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_9tripod-x3568-v4=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-leds-gpio=y
          CONFIG_PACKAGE_kmod-realtek-pcb=y
          CONFIG_STRIP_KERNEL_EXPORTS=y
          CONFIG_USE_SSTRIP=y
          CONFIGEOF
          make defconfig

      - name: Download source packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) world V=s

      - name: Prepare release artifacts
        run: |
          mkdir -p artifacts
          cd openwrt/bin/targets/rockchip/armv8
          for f in *.img.gz *.sha256sum; do
            [ -f "$f" ] && cp "$f" $GITHUB_WORKSPACE/artifacts/
          done
          cd $GITHUB_WORKSPACE/artifacts
          sha256sum * > checksums.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-yf-024e-30
          path: artifacts/
          retention-days: 30
